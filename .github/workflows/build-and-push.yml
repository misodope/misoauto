name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend
  DEPLOY_TAG: main-${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=long
            type=ref,event=branch

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-,format=long
            type=ref,event=branch

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:buildcache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          target: runner
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:buildcache,mode=max

      - name: Build summary
        run: |
          echo "## 🚀 Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Backend" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME_BACKEND }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Frontend" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "ghcr.io/${{ env.IMAGE_NAME_FRONTEND }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: DEPLOY_TAG
          script: |
            set -eu
            cd /root/misoauto
            backend_image="ghcr.io/misodope/misoauto/backend:${DEPLOY_TAG}"
            frontend_image="ghcr.io/misodope/misoauto/frontend:${DEPLOY_TAG}"

            # Pull the exact images built for this commit and make them available
            # under the tags referenced by the existing Compose file.
            docker pull "${backend_image}"
            docker pull "${frontend_image}"
            docker tag "${backend_image}" ghcr.io/misodope/misoauto/backend:latest
            docker tag "${frontend_image}" ghcr.io/misodope/misoauto/frontend:latest

            # Keep the current application running while the database is prepared.
            docker-compose -f docker-compose.prod.yml up -d postgres
            for attempt in $(seq 1 30); do
              if docker-compose -f docker-compose.prod.yml exec -T postgres pg_isready -U misodope -d misoauto; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "Postgres did not become ready in time"
                exit 1
              fi
              sleep 2
            done
            # Run migrations from the files packaged in the backend image.
            docker-compose -f docker-compose.prod.yml run --rm --no-deps backend sh -c 'cd /app/backend && npx prisma migrate deploy --config=prisma.config.ts'
            # Start the application only after migrations succeed.
            docker-compose -f docker-compose.prod.yml up -d backend frontend

            wait_for_healthy() {
              container="$1"
              for attempt in $(seq 1 60); do
                status=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container" 2>/dev/null || true)
                case "$status" in
                  healthy)
                    return 0
                    ;;
                  unhealthy)
                    docker logs --tail=100 "$container"
                    return 1
                    ;;
                esac
                sleep 2
              done
              docker logs --tail=100 "$container"
              echo "$container did not become healthy in time"
              return 1
            }

            wait_for_healthy misoauto-backend
            wait_for_healthy misoauto-frontend
            # Clean up dangling images
            docker image prune -f
            echo "Deployment complete!"
